services:
  - type: web
    name: telegram-temp-mail
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: INBOXMAIL_API_KEY
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: DOMAIN
        value: deeptracex.online
      - key: WEBHOOK_SECRET
        sync: false
