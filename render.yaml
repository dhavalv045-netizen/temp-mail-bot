services:
  - type: web
    name: telegram-temp-mail
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MAIL_BACKEND
        value: cloudflare
      - key: CLOUDFLARE_MAIL_URL
        sync: false
      - key: CLOUDFLARE_MAIL_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_ACCESS_KEY
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: DOMAIN
        value: accounthub.live
      - key: WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
